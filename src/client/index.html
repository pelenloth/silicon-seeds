<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var ids = ["daylight", "tokyonight", "opencode", "dracula"];
        var legacy = {
          bumblebee: "daylight",
          light: "daylight",
          dark: "tokyonight",
        };
        var pref = null;
        try {
          pref = localStorage.getItem("theme");
        } catch (e) {}
        if (pref && legacy[pref]) pref = legacy[pref];
        if (ids.indexOf(pref) === -1) {
          var dark = false;
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
          pref = dark ? "tokyonight" : "daylight";
        }
        document.documentElement.setAttribute("data-theme", pref);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Silicon Seeds: a local studio for AI images, video and audio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Silicon Seeds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
